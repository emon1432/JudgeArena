name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in JudgeArena"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us diagnose the issue.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component or Platform
      description: What part of the application is affected?
      options:
        - "Platform Sync / Scraper (Codeforces)"
        - "Platform Sync / Scraper (AtCoder)"
        - "Platform Sync / Scraper (Other)"
        - "DataTables / Search / Filter"
        - "Admin Dashboard"
        - "Public Contest / Problem Pages"
        - "Authentication / User Profile"
        - "CI/CD / Deployment"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: Expected ... but got ...
    validations:
      required: true

  - type: textarea
    id: error_logs
    attributes:
      label: Error Logs or Stack Trace
      description: Please paste any relevant exception logs or terminal output here.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have verified this is a distinct issue not already reported in existing open issues.
          required: true

