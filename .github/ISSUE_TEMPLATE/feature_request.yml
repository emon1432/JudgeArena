name: "🚀 Feature Request / Platform Integration"
description: "Suggest a new feature, improvement, or competitive programming platform integration"
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement or a new competitive programming platform to integrate into JudgeArena!

  - type: dropdown
    id: category
    attributes:
      label: Proposal Category
      description: Select the area your suggestion relates to.
      options:
        - "New Platform Integration (e.g. LeetCode, CodeChef, CSES, HackerRank)"
        - "Contest Standings & Analytics"
        - "Search / Filter / DataTable Enhancement"
        - "UI / UX Modernization"
        - "Performance / Queue Optimization"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or a missing capability?
      placeholder: I'm always frustrated when [...]
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Feature Behavior
      description: Describe the solution you'd like to see implemented.
      placeholder: Detailed description of what should happen and how it should look/work.
    validations:
      required: true

  - type: textarea
    id: platform_details
    attributes:
      label: Platform API / Documentation Link (If applicable)
      description: If proposing a new platform, provide links to its official API or contest pages.
      placeholder: https://...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any alternative solutions or features you've considered.

