name: Code Quality & Style

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pint:
    name: 🎨 Code Style (Laravel Pint)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v7

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, curl, bcmath
          tools: composer:v2
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: 🎨 Run Pint (Code Style Check)
        run: vendor/bin/pint --test

