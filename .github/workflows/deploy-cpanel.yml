name: Deploy to cPanel

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: false
        default: "Manual deployment trigger"

concurrency:
  group: deploy-cpanel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Sync Files to cPanel (Live)
    runs-on: ubuntu-latest

    # =========================================================================
    # CPANEL DEPLOYMENT STATUS: TEMPORARILY DISABLED
    # =========================================================================
    # cPanel credentials are not configured yet. To enable:
    # 1. Set FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD in GitHub Secrets:
    #    (Repository Settings -> Secrets and variables -> Actions)
    # 2. Change `if: false` below to `if: true` or remove the line completely.
    # =========================================================================
    if: false

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, curl, bcmath
          tools: composer:v2

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 📦 Install Composer Dependencies (Production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: 🔨 Build Vite Assets
        run: |
          npm ci
          npm run build

      - name: 📂 Sync files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './judgearena.bdusedautoparts.com/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            .env
            .env.*
            .editorconfig
            README.md
            phpunit.xml
            tests/**
            storage/logs/**
            storage/framework/sessions/**
            storage/framework/cache/**
            public/uploads/**

